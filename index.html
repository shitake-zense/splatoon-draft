<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<style>
@import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&family=Zen+Dots&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --y:#F5E642;--o:#FF6B35;
  --a:#4A90E2;--b:#E8630A;
  --bg:#1a1a2e;--s1:#16213e;--s2:#0f3460;
  --tx:#f0f0f0;--mu:#a0a8c0;
  --bn:#ff4757;--pk:#2ed573;--r:10px;
}
body{font-family:'M PLUS Rounded 1c',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;padding:12px;}
h1,h2,h3{font-family:'Zen Dots',sans-serif;}
.app{max-width:920px;margin:0 auto;}
.screen{display:none;}.screen.active{display:block;}

/* Loading */
#loading{text-align:center;padding:60px 20px;}
#loading h2{color:var(--y);font-size:22px;margin-bottom:16px;}
.spinner{width:44px;height:44px;border:4px solid #2a2a4a;border-top-color:var(--y);border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px;}
@keyframes spin{to{transform:rotate(360deg);}}
.load-msg{color:var(--mu);font-size:13px;}
#err-msg{color:var(--bn);margin-top:12px;font-size:13px;display:none;}

/* LOGO */
.logo{text-align:center;margin-bottom:20px;}
.logo h1{font-size:clamp(18px,4vw,28px);color:var(--y);text-shadow:3px 3px 0 var(--o);letter-spacing:2px;}
.logo p{color:var(--mu);font-size:12px;margin-top:4px;}

/* SETUP */
.setup-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-bottom:14px;}
.card{background:var(--s1);border:1.5px solid #2a2a4a;border-radius:var(--r);padding:14px;}
.card h3{font-size:11px;color:var(--y);margin-bottom:12px;letter-spacing:1px;}
.row{display:flex;gap:8px;align-items:center;margin-bottom:9px;}
.row label{font-size:12px;color:var(--mu);min-width:68px;}
input[type=text],select{background:#0f1729;border:1.5px solid #2a3a5a;border-radius:6px;color:var(--tx);padding:7px 9px;font-size:13px;font-family:inherit;width:100%;}
input[type=text]:focus,select:focus{outline:none;border-color:var(--y);}
.row select{flex:1;}
.bp{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px;}
.bp-i{font-size:10px;padding:3px 7px;border-radius:4px;background:#0f1729;border:1px solid #2a3a5a;}
.bp-i.a{border-color:var(--a);color:var(--a);}.bp-i.b{border-color:var(--b);color:var(--b);}
.div{height:1px;background:#2a2a4a;margin:9px 0;}
.btn-start{width:100%;padding:13px;background:linear-gradient(135deg,var(--y),var(--o));border:none;border-radius:var(--r);font-family:'Zen Dots',sans-serif;font-size:14px;color:#1a1a2e;cursor:pointer;letter-spacing:1px;transition:opacity .1s,transform .1s;margin-top:6px;}
.btn-start:hover{opacity:.9;transform:scale(1.01);}
.btn-start:active{transform:scale(.98);}

/* DRAFT */
.dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
.ph{font-family:'Zen Dots',sans-serif;font-size:11px;padding:5px 12px;border-radius:20px;letter-spacing:1px;}
.ph-ban{background:#3d1a1a;color:var(--bn);border:1px solid var(--bn);}
.ph-pick{background:#1a3d2a;color:var(--pk);border:1px solid var(--pk);}
.ph-done{background:#2a2a1a;color:var(--y);border:1px solid var(--y);}

.match-box{background:var(--s1);border:1px solid #2a2a4a;border-radius:var(--r);margin-bottom:12px;overflow:hidden;}
.stage-wrap{width:100%;height:110px;position:relative;overflow:hidden;background:linear-gradient(135deg,#0a0a2e 0%,#0f2460 50%,#0a1a3e 100%);}
.stage-wrap::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 30% 50%,rgba(74,144,226,.15) 0%,transparent 60%),radial-gradient(ellipse at 70% 50%,rgba(245,230,66,.08) 0%,transparent 60%);}
.stage-wrap img{width:100%;height:100%;object-fit:cover;object-position:center 40%;opacity:.65;position:absolute;top:0;left:0;}
.stage-ov{position:absolute;bottom:0;left:0;right:0;padding:8px 14px;background:linear-gradient(transparent,rgba(0,0,0,.85));}
.rule-tag{display:inline-block;font-size:11px;padding:2px 10px;border-radius:10px;background:var(--y);color:#1a1a2e;font-weight:700;margin-bottom:8px;width:fit-content;}
.stage-name{font-family:'Zen Dots',sans-serif;font-size:clamp(13px,3vw,20px);color:#fff;text-shadow:0 0 20px rgba(74,144,226,.5);}

.tc{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.tp{background:var(--s1);border-radius:var(--r);padding:10px;border:2px solid;}
.tp.alpha{border-color:var(--a);}.tp.bravo{border-color:var(--b);}
.tp.active-t{box-shadow:0 0 14px rgba(245,230,66,.2);}
.th2{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
.tn{font-family:'Zen Dots',sans-serif;font-size:clamp(10px,2vw,13px);}
.tp.alpha .tn{color:var(--a);}.tp.bravo .tn{color:var(--b);}
.ti{font-size:10px;padding:3px 8px;background:var(--y);color:#1a1a2e;border-radius:10px;font-weight:700;animation:pu 1s infinite;}
@keyframes pu{0%,100%{opacity:1;}50%{opacity:.55;}}
.ws{display:flex;align-items:center;gap:5px;padding:4px 6px;border-radius:6px;margin-bottom:4px;min-height:28px;}
.ws.banned{background:rgba(255,71,87,.12);border:1px solid rgba(255,71,87,.28);}
.ws.picked{background:rgba(46,213,115,.1);border:1px solid rgba(46,213,115,.28);}
.ws.empty{background:rgba(255,255,255,.04);border:1px dashed #2a3a5a;color:var(--mu);}
.ws .sl{font-size:9px;color:var(--mu);min-width:22px;}
.ws.banned .sl{color:var(--bn);}.ws.picked .sl{color:var(--pk);}
.ws img{width:22px;height:22px;object-fit:contain;flex-shrink:0;}
.ws .sn{flex:1;font-size:10px;line-height:1.2;}

.tp-txt{text-align:center;padding:6px;font-size:12px;color:var(--mu);margin-bottom:8px;}
.tp-txt strong{color:var(--y);}

.wsec{background:var(--s1);border:1px solid #2a2a4a;border-radius:var(--r);padding:10px;}
.wsh{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.wsh h3{font-size:11px;color:var(--y);letter-spacing:1px;}
.cf{display:flex;gap:4px;flex-wrap:wrap;flex:1;}
.cb{font-size:10px;padding:3px 7px;border-radius:10px;border:1px solid #2a3a5a;background:transparent;color:var(--mu);cursor:pointer;font-family:inherit;transition:all .15s;}
.cb.on{background:var(--y);color:#1a1a2e;border-color:var(--y);font-weight:700;}
.wg{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:5px;max-height:270px;overflow-y:auto;padding-right:3px;}
.wg::-webkit-scrollbar{width:3px;}
.wg::-webkit-scrollbar-track{background:#0f1729;}
.wg::-webkit-scrollbar-thumb{background:#2a3a5a;border-radius:2px;}
.wb{background:#0f1729;border:1.5px solid #1a2a4a;border-radius:6px;padding:5px 3px;text-align:center;cursor:pointer;transition:all .15s;position:relative;font-family:inherit;color:var(--tx);}
.wb:hover:not(:disabled){border-color:var(--y);background:#1a2a3a;transform:translateY(-1px);}
.wb:disabled{opacity:.28;cursor:not-allowed;}
.wb img{width:38px;height:38px;object-fit:contain;display:block;margin:0 auto 2px;}
.wb .wn{font-size:8px;line-height:1.2;color:var(--mu);}
.wb.is-bn{border-color:var(--bn);background:rgba(255,71,87,.1);}
.wb.is-pk{border-color:var(--pk);background:rgba(46,213,115,.1);}
.wst{position:absolute;top:2px;right:2px;font-size:8px;padding:1px 3px;border-radius:3px;font-weight:700;}
.wst.b{background:var(--bn);color:#fff;}.wst.p{background:var(--pk);color:#0a2a1a;}

/* RESULT */
.rm{background:#0a0a2e;border-radius:var(--r);overflow:hidden;margin-bottom:14px;position:relative;}
.rm img{width:100%;height:90px;object-fit:cover;object-position:center 40%;opacity:.75;display:block;}
.rmi{padding:10px 14px;text-align:center;}
.br{font-family:'Zen Dots',sans-serif;font-size:clamp(15px,4vw,22px);color:var(--y);text-shadow:2px 2px 0 var(--o);}
.bs{font-size:13px;color:var(--mu);margin-top:2px;}
.rc{background:var(--s1);border-radius:var(--r);padding:14px;border:2px solid;margin-bottom:10px;}
.rc.alpha{border-color:var(--a);}.rc.bravo{border-color:var(--b);}
.rtt{font-family:'Zen Dots',sans-serif;font-size:13px;margin-bottom:8px;}
.rc.alpha .rtt{color:var(--a);}.rc.bravo .rtt{color:var(--b);}
.rl{font-size:10px;color:var(--mu);margin-bottom:5px;}
.rw{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.rt{font-size:11px;padding:3px 8px;border-radius:5px;background:rgba(255,255,255,.07);border:1px solid #2a3a5a;display:flex;align-items:center;gap:4px;}
.rt img{width:18px;height:18px;object-fit:contain;}
.rt.bnt{background:rgba(255,71,87,.1);border-color:rgba(255,71,87,.4);color:#ff8a96;text-decoration:line-through;}
.btn-re{width:100%;padding:11px;background:transparent;border:2px solid var(--y);border-radius:var(--r);font-family:'Zen Dots',sans-serif;font-size:13px;color:var(--y);cursor:pointer;letter-spacing:1px;transition:all .15s;}
.btn-re:hover{background:var(--y);color:#1a1a2e;}
</style>
</head>
<body>
<div class="app">

<!-- LOADING -->
<div id="loading">
  <div class="spinner"></div>
  <h2>データ読込中...</h2>
  <div class="load-msg" id="lmsg">stat.ink API から武器・ステージ情報を取得しています</div>
  <div id="err-msg"></div>
</div>

<!-- SETUP -->
<div id="s-setup" class="screen">
  <div class="logo"><h1>SPLATOON DRAFT</h1><p>スプラトゥーン3 プライベートマッチ用ドラフトツール</p></div>
  <div class="setup-grid">
    <div class="card">
      <h3>TEAM SETTINGS</h3>
      <div style="margin-bottom:9px;">
        <label style="font-size:10px;color:var(--a);display:block;margin-bottom:3px;">アルファチーム</label>
        <input type="text" id="n-a" value="アルファ">
      </div>
      <div style="margin-bottom:9px;">
        <label style="font-size:10px;color:var(--b);display:block;margin-bottom:3px;">ブラボーチーム</label>
        <input type="text" id="n-b" value="ブラボー">
      </div>
      <div class="div"></div>
      <div class="row">
        <label>人数</label>
        <select id="sz">
          <option value="4">4v4</option>
          <option value="3">3v3</option>
          <option value="2">2v2</option>
          <option value="1">1v1</option>
        </select>
      </div>
    </div>
    <div class="card">
      <h3>DRAFT SETTINGS</h3>
      <div class="row">
        <label>Banフェーズ</label>
        <select id="bc">
          <option value="0">Banなし</option>
          <option value="1">各1Ban</option>
          <option value="2">各2Ban</option>
          <option value="3" selected>各3Ban</option>
          <option value="4">各4Ban</option>
        </select>
      </div>
      <div class="row">
        <label>先攻</label>
        <select id="ft">
          <option value="alpha">アルファ先攻</option>
          <option value="bravo">ブラボー先攻</option>
          <option value="random">ランダム</option>
        </select>
      </div>
      <div class="div"></div>
      <div style="font-size:10px;color:var(--mu);margin-bottom:5px;">Ban順プレビュー</div>
      <div class="bp" id="bprev"></div>
    </div>
    <div class="card">
      <h3>RULE &amp; STAGE</h3>
      <div class="row">
        <label>ルール</label>
        <select id="rm">
          <option value="random">ランダム</option>
          <option value="ガチエリア">ガチエリア</option>
          <option value="ガチヤグラ">ガチヤグラ</option>
          <option value="ガチホコ">ガチホコ</option>
          <option value="ガチアサリ">ガチアサリ</option>
        </select>
      </div>
      <div class="row">
        <label>ステージ</label>
        <select id="sm"><option value="random">ランダム</option></select>
      </div>
      <div style="font-size:10px;color:var(--mu);margin-top:8px;" id="weapon-count-info"></div>
    </div>
  </div>
  <button class="btn-start" onclick="startDraft()">▶ ドラフト開始</button>
</div>

<!-- DRAFT -->
<div id="s-draft" class="screen">
  <div class="dh">
    <div id="pbadge" class="ph ph-ban">BAN PHASE</div>
    <div id="tctr" style="font-size:11px;color:var(--mu);"></div>
  </div>
  <div class="match-box">
    <div class="stage-wrap">
      <img id="st-img" src="" alt="" onerror="this.style.opacity='0'">
      <div class="stage-ov">
        <div class="rule-tag" id="d-rule">-</div>
        <div class="stage-name" id="d-stage">-</div>
      </div>
    </div>
  </div>
  <div class="tc">
    <div class="tp alpha" id="pa">
      <div class="th2">
        <div class="tn" id="da">アルファ</div>
        <div class="ti" id="tia" style="display:none">YOUR TURN</div>
      </div>
      <div id="sla"></div>
    </div>
    <div class="tp bravo" id="pb">
      <div class="th2">
        <div class="tn" id="db">ブラボー</div>
        <div class="ti" id="tib" style="display:none">YOUR TURN</div>
      </div>
      <div id="slb"></div>
    </div>
  </div>
  <div class="tp-txt" id="tprompt"></div>
  <div class="wsec">
    <div class="wsh">
      <h3>WEAPONS</h3>
      <div class="cf" id="cf"></div>
    </div>
    <div class="wg" id="wg"></div>
  </div>
</div>

<!-- RESULT -->
<div id="s-result" class="screen">
  <div class="logo"><h1>DRAFT COMPLETE</h1><p>ドラフト結果</p></div>
  <div class="rm">
    <img id="r-simg" src="" alt="" onerror="this.style.display='none'">
    <div class="rmi">
      <div class="br" id="r-rule"></div>
      <div class="bs" id="r-stage"></div>
    </div>
  </div>
  <div class="tc">
    <div class="rc alpha">
      <div class="rtt" id="rna"></div>
      <div class="rl">BAN</div><div class="rw" id="rba"></div>
      <div class="rl">PICK</div><div class="rw" id="rpa"></div>
    </div>
    <div class="rc bravo">
      <div class="rtt" id="rnb"></div>
      <div class="rl">BAN</div><div class="rw" id="rbb"></div>
      <div class="rl">PICK</div><div class="rw" id="rpb"></div>
    </div>
  </div>
  <button class="btn-re" onclick="goSetup()">↩ 設定に戻る</button>
</div>

</div>

<script>
// ===== DATA SOURCES (ローカル) =====
// 武器データ: data/weapons.json (scripts/1_fetch_weapons.py で生成)
// 武器画像:   images/weapons/Path_Wst_*.png (scripts/2_download_images.py で取得)
// ステージ画像: images/stages/*.png (scripts/3_download_stages.py で取得)

const WEAPONS_JSON = "data/weapons.json";
const WEAPONS_IMG  = "images/weapons/";
const STAGES_IMG   = "images/stages/";

// Stage list — images/stages/{ja}.png と対応
const STAGES_DATA = [
  {ja:"ユノハナ大渓谷"},
  {ja:"ゴンズイ地区"},
  {ja:"ヤガラ市場"},
  {ja:"マテガイ放水路"},
  {ja:"ナメロウ金属"},
  {ja:"クサヤ温泉"},
  {ja:"ヒラメが丘団地"},
  {ja:"マサバ海峡大橋"},
  {ja:"スメーシーワールド"},
  {ja:"キンメダイ美術館"},
  {ja:"マヒマヒリゾート＆スパ"},
  {ja:"海女美術大学"},
  {ja:"バイガイ亭"},
  {ja:"チョウザメ造船"},
  {ja:"ザトウマーケット"},
  {ja:"タラポートショッピングパーク"},
  {ja:"ネギトロ炭鉱"},
  {ja:"カジキ空港"},
  {ja:"リュウグウターミナル"},
  {ja:"デカライン高架下"},
  {ja:"ナンプラー遺跡"},
  {ja:"コンブトラック"},
  {ja:"タカアシ経済特区"},
  {ja:"オヒョウ海運"},
  {ja:"マンタマリア号"},
];

const RULES = ["ガチエリア","ガチヤグラ","ガチホコ","ガチアサリ"];

let WEAPONS = [];
let state = {};
let activeCat = "すべて";

// ===== LOAD DATA (ローカルJSONから) =====
async function loadData(){
  try {
    document.getElementById('lmsg').textContent = 'ローカルデータを読み込んでいます...';
    const res = await fetch(WEAPONS_JSON);
    if(!res.ok) throw new Error('weapons.json の読み込みに失敗: ' + res.status);
    const data = await res.json();

    // weapons.json は既にフィルタ済みなので、imgUrl だけローカルパスに変換
    WEAPONS = data.map(w => ({
      key:    w.key,
      name:   w.name,
      cat:    w.cat,
      imgUrl: WEAPONS_IMG + w.imgFile,
    }));

    // Populate stage select
    const sel = document.getElementById('sm');
    STAGES_DATA.forEach(s => {
      const o = document.createElement('option');
      o.value = s.ja; o.textContent = s.ja;
      sel.appendChild(o);
    });

    document.getElementById('weapon-count-info').textContent =
      `✓ ${WEAPONS.length}種の武器を読み込みました`;

    document.getElementById('loading').style.display = 'none';
    document.getElementById('s-setup').classList.add('active');
    updateBP();

  } catch(e) {
    document.getElementById('lmsg').textContent = '読み込みに失敗しました';
    const em = document.getElementById('err-msg');
    em.style.display = 'block';
    em.textContent = 'エラー: ' + e.message + '\nネットワーク接続を確認してください。';
  }
}

// ===== SETUP =====
function updateBP(){
  const n = parseInt(document.getElementById('bc').value);
  const f = document.getElementById('ft').value;
  const el = document.getElementById('bprev');
  el.innerHTML = '';
  if(n===0){el.innerHTML='<span style="color:var(--mu);font-size:11px;">Banなし</span>';return;}
  const first = f==='bravo'?'bravo':'alpha';
  const sec = first==='alpha'?'bravo':'alpha';
  for(let i=0;i<n*2;i++){
    const t = i%2===0?first:sec;
    const d = document.createElement('div');
    d.className = 'bp-i '+(t==='alpha'?'a':'b');
    d.textContent = `BAN${i+1}:${t==='alpha'?'α':'β'}`;
    el.appendChild(d);
  }
}
document.getElementById('bc').addEventListener('change', updateBP);
document.getElementById('ft').addEventListener('change', updateBP);

function startDraft(){
  const an = document.getElementById('n-a').value || 'アルファ';
  const bn = document.getElementById('n-b').value || 'ブラボー';
  const ts = parseInt(document.getElementById('sz').value);
  const bc = parseInt(document.getElementById('bc').value);
  const ft = document.getElementById('ft').value;
  const rm = document.getElementById('rm').value;
  const sm = document.getElementById('sm').value;

  const rule = rm==='random' ? RULES[Math.floor(Math.random()*RULES.length)] : rm;
  const stageObj = sm==='random'
    ? STAGES_DATA[Math.floor(Math.random()*STAGES_DATA.length)]
    : STAGES_DATA.find(s=>s.ja===sm) || STAGES_DATA[0];

  const first = ft==='random' ? (Math.random()<.5?'alpha':'bravo') : ft;
  const sec = first==='alpha'?'bravo':'alpha';

  let seq = [];
  for(let i=0;i<bc*2;i++) seq.push({phase:'ban',team:i%2===0?first:sec});
  for(let i=0;i<ts*2;i++){
    if(i===0) seq.push({phase:'pick',team:first});
    else seq.push({phase:'pick',team:seq[seq.length-1].team==='alpha'?'bravo':'alpha'});
  }

  state = {an,bn,ts,bc,rule,stageObj,seq,idx:0,
    bans:{alpha:[],bravo:[]},picks:{alpha:[],bravo:[]}};
  activeCat = 'すべて';
  renderDraft();
  showScreen('draft');
}

// ===== DRAFT =====
function renderDraft(){
  const S = state;
  const step = S.seq[S.idx];
  const done = !step;

  const badge = document.getElementById('pbadge');
  if(done){badge.textContent='COMPLETE';badge.className='ph ph-done';}
  else if(step.phase==='ban'){badge.textContent='BAN PHASE';badge.className='ph ph-ban';}
  else{badge.textContent='PICK PHASE';badge.className='ph ph-pick';}

  document.getElementById('tctr').textContent = done?'':`STEP ${S.idx+1} / ${S.seq.length}`;
  document.getElementById('d-rule').textContent = S.rule;
  document.getElementById('d-stage').textContent = S.stageObj.ja;
  const si = document.getElementById('st-img');
  si.src = STAGES_IMG + S.stageObj.ja + '.png';
  si.style.opacity = '';

  document.getElementById('da').textContent = S.an;
  document.getElementById('db').textContent = S.bn;

  const cur = step?.team;
  document.getElementById('tia').style.display = cur==='alpha'?'':'none';
  document.getElementById('tib').style.display = cur==='bravo'?'':'none';
  document.getElementById('pa').classList.toggle('active-t',cur==='alpha');
  document.getElementById('pb').classList.toggle('active-t',cur==='bravo');

  renderSlots('alpha');
  renderSlots('bravo');

  const pt = document.getElementById('tprompt');
  if(done){
    pt.innerHTML='<strong style="color:var(--pk)">ドラフト完了！</strong>';
    setTimeout(()=>showResult(),900);
  } else {
    const tn = step.team==='alpha'?S.an:S.bn;
    const ac = step.phase==='ban'?'BAN':'PICK';
    const col = step.team==='alpha'?'var(--a)':'var(--b)';
    pt.innerHTML=`<strong style="color:${col}">${tn}</strong> の <strong>${ac}ターン</strong> — 武器を選んでください`;
  }
  renderGrid();
}

function renderSlots(team){
  const S = state;
  const c = document.getElementById('sl'+team[0]);
  c.innerHTML = '';
  for(let i=0;i<S.bc;i++){
    const w = S.bans[team][i];
    const d = document.createElement('div');
    d.className = 'ws '+(w?'banned':'empty');
    d.innerHTML = w
      ? `<span class="sl">BAN${i+1}</span><img src="${w.imgUrl}" alt="${w.name}" onerror="this.style.display='none'"><span class="sn">${w.name}</span>`
      : `<span class="sl">BAN${i+1}</span><span class="sn">未選択</span>`;
    c.appendChild(d);
  }
  for(let i=0;i<S.ts;i++){
    const w = S.picks[team][i];
    const d = document.createElement('div');
    d.className = 'ws '+(w?'picked':'empty');
    d.innerHTML = w
      ? `<span class="sl">P${i+1}</span><img src="${w.imgUrl}" alt="${w.name}" onerror="this.style.display='none'"><span class="sn">${w.name}</span>`
      : `<span class="sl">P${i+1}</span><span class="sn">未選択</span>`;
    c.appendChild(d);
  }
}

function renderGrid(){
  const S = state;
  const step = S.seq[S.idx];
  const cats = ['すべて',...new Set(WEAPONS.map(w=>w.cat))];

  const cf = document.getElementById('cf');
  cf.innerHTML = '';
  cats.forEach(c=>{
    const btn = document.createElement('button');
    btn.className = 'cb'+(c===activeCat?' on':'');
    btn.textContent = c;
    btn.onclick = ()=>{activeCat=c;renderGrid();};
    cf.appendChild(btn);
  });

  const allBanned = [...S.bans.alpha,...S.bans.bravo].map(w=>w.key);
  const allPicked = [...S.picks.alpha,...S.picks.bravo].map(w=>w.key);
  const filtered = activeCat==='すべて'?WEAPONS:WEAPONS.filter(w=>w.cat===activeCat);

  const grid = document.getElementById('wg');
  grid.innerHTML = '';
  filtered.forEach(w=>{
    const isBan = allBanned.includes(w.key);
    const isPick = allPicked.includes(w.key);
    const unavail = isBan||isPick;
    const btn = document.createElement('button');
    btn.className = 'wb'+(isBan?' is-bn':'')+(isPick?' is-pk':'');
    btn.disabled = unavail||!step;
    btn.innerHTML = `<img src="${w.imgUrl}" alt="${w.name}" onerror="this.style.height='38px';this.style.opacity='.2'">
      <div class="wn">${w.name}</div>
      ${isBan?'<span class="wst b">BAN</span>':''}
      ${isPick?'<span class="wst p">PICK</span>':''}`;
    if(!unavail&&step) btn.onclick=()=>pick(w);
    grid.appendChild(btn);
  });
}

function pick(w){
  const S = state;
  const step = S.seq[S.idx];
  if(!step) return;
  if(step.phase==='ban') S.bans[step.team].push(w);
  else S.picks[step.team].push(w);
  S.idx++;
  renderDraft();
}

// ===== RESULT =====
function showResult(){
  const S = state;
  document.getElementById('r-rule').textContent = S.rule;
  document.getElementById('r-stage').textContent = '📍 '+S.stageObj.ja;
  document.getElementById('r-simg').src = STAGES_IMG + S.stageObj.ja + '.png';
  document.getElementById('rna').textContent = S.an;
  document.getElementById('rnb').textContent = S.bn;
  ['alpha','bravo'].forEach(t=>{
    const sfx = t==='alpha'?'a':'b';
    const be = document.getElementById('rb'+sfx);
    const pe = document.getElementById('rp'+sfx);
    be.innerHTML='';pe.innerHTML='';
    if(!S.bans[t].length) be.innerHTML='<span style="font-size:11px;color:var(--mu)">なし</span>';
    else S.bans[t].forEach(w=>{
      const tg=document.createElement('div');
      tg.className='rt bnt';
      tg.innerHTML=`<img src="${w.imgUrl}" alt="" onerror="this.style.display='none'">${w.name}`;
      be.appendChild(tg);
    });
    S.picks[t].forEach(w=>{
      const tg=document.createElement('div');
      tg.className='rt';
      tg.innerHTML=`<img src="${w.imgUrl}" alt="" onerror="this.style.display='none'">${w.name}`;
      pe.appendChild(tg);
    });
  });
  showScreen('result');
}

function showScreen(n){
  ['setup','draft','result'].forEach(s=>
    document.getElementById('s-'+s).classList.toggle('active',s===n)
  );
}
function goSetup(){activeCat='すべて';showScreen('setup');}

// START
loadData();
</script>
</body>
